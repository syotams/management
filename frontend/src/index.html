<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Task Manager</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    (function () {
      var valid = {
        light: true,
        'dark-github': true,
        'dark-material-purple': true,
        'dark-colorffy': true
      };
      var t = localStorage.getItem('theme');
      if (t === 'dark') t = 'dark-github';
      if (
        t === 'dark-material' ||
        t === 'dark-material-indigo' ||
        t === 'dark-material-orange'
      ) {
        t = 'dark-material-purple';
      }
      if (t === 'light-beachfront' || t === 'light-therapy') t = 'light';
      if (!valid[t]) {
        t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark-github' : 'light';
      }
      var isDark = t.indexOf('dark') === 0;
      var variant = t === 'dark-github'
        ? 'github'
        : t === 'dark-material-purple'
          ? 'material-purple'
          : t === 'dark-colorffy'
            ? 'colorffy'
            : 'light';
      document.documentElement.setAttribute('data-bs-theme', isDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-dark-variant', variant);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
